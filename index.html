<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Forage — Find the good stuff.</title>
  <meta name="description" content="Forage is a topic-driven aggregation site. Forage the open web. Find the good stuff.">
  <meta name="theme-color" content="#2D5A34">
  <meta property="og:title" content="Forage">
  <meta property="og:description" content="Forage the open web. Find the good stuff. A topic-driven community forum.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://forage.fyi/">
  <meta property="og:image" content="https://forage.fyi/assets/banner-forum.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://forage.fyi/assets/banner-forum.jpg">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F8F4EC">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#262019">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
  <script>
    /* Apply the saved SKIN before first paint. Skins subsumed themes (plan
       2026-08-26-1): a palette is a skin, and a skin is a stylesheet — so
       unlike the old data-theme attribute, which was synchronous, this has to
       inject the <link> here. Leaving it to js/skins.js paints the light
       palette first and flashes on every load of a non-default skin.

       `default` IS Forage light and lives in tokens.css, so it needs no sheet
       and the common case cannot flash at all.

       Two things this file knows about the registry, both pinned by
       test/skins.test.js so they cannot drift: hrefs follow skins/<id>.css,
       and the dark fallback equals siblingOf('default'). The id matches
       skins.js LINK_ID so apply() adopts this element rather than adding a
       second sheet. */
    try {
      var id = localStorage.getItem('forage.skin');
      if (!id) {
        id = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          ? 'forage-dark' : 'default';
      }
      if (id && id !== 'default') {
        var l = document.createElement('link');
        l.id = 'skin-sheet'; l.rel = 'stylesheet'; l.href = '/skins/' + id + '.css';
        document.head.appendChild(l);
      }
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="toasts"></div>
  <noscript style="display:block;padding:24px;font-family:system-ui">Forage is a client-side prototype and needs JavaScript enabled.</noscript>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
