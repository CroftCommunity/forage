name: ci

# Workspace CI pattern (CroftC/.claude/CI-PATTERN.md; canonical reasoning in
# croft-pwa/docs/CI.md). Gate on every PR and every push to main. No deploy
# job: GitHub Pages serves this repo's main branch directly, untouched here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The manual path — dispatch is exempt from webhook-delivery throttling
  # (observed 2026-08-06: pushes stopped triggering runs for hours).
  workflow_dispatch:

permissions:
  contents: read

# Per-ref group: a new push to the same ref supersedes its own stale run and
# can never cancel a run on another ref. (Rule 4 is about protecting a deploy;
# there is no deploy job, so per-ref is sufficient.)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    # Without a timeout a hung test inherits GitHub's 6-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # The gate, identical locally and in CI: the suite, then conformance
      # (pure fold vs the memory substrate over the scenario library — BSM
      # invariant 9's merge gate). Runtime deps: zero; devDependencies exist
      # (Stryker) but the gate needs none of them, so still no npm ci.
      - run: npm test && npm run conformance

  # The workflow corpus (plan 2026-08-25-1, 1d): the app as a running system
  # in a real browser — journey files under e2e/, shim-backed and hermetic.
  # LIVE/DOCKER journeys skip-report here by design (credentialed/daemon-bound;
  # they run locally). A separate job so a browser-install failure is
  # distinguishable from a unit-suite failure at a glance.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run workflows
